<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixanova Events — Votre événement</title>
  <meta name="description" content="Choisissez votre événement et découvrez les offres de location d’écrans LED Pixanova pour votre kiosque.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/catalog.css">
</head>
<body class="catalog-page">
  <header class="top">
    <div class="wrap row1"><a class="logos" href="/" aria-label="Pixanova Events — Accueil"><img class="px" src="/assets/images/px-crop-sm.png" alt="Pixanova"><span class="catalog-brand">Events</span></a></div>
  </header>
  <main class="wrap catalog-main">
    <div class="catalog-heading"><h1 id="events-title">Votre événement</h1></div>
    <section aria-labelledby="events-title">
      <div class="event-grid" id="events" aria-live="polite"><p>Chargement des événements…</p></div>
    </section>
    <noscript>Activez JavaScript pour afficher les événements.</noscript>
  </main>
  <footer><div class="wrap"><span>Pixanova Events · Montréal</span><a href="mailto:info@pixanova.ca">Nous joindre</a></div></footer>
  <script type="module" src="/js/catalog.js"></script>
</body>
</html>
