# Site statique (dossier public/) + fonctions serveur Netlify (paiement Stripe).
[build]
  command = "npm run build"
  publish = "public"
  functions = "server"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888
  framework = "#custom"

# Les vidéos et images changent rarement : cache navigateur d'une journée.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
